# Builds the debug APK on GitHub's servers and attaches it to a private pre-release,
# so it can be downloaded straight onto a phone without a local Android toolchain.
name: Android APK

on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Reuse one debug signing key across builds so a new APK installs over the previous one.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Engine tests
        run: bash ./gradlew :engine:test

      - name: Build debug APK
        run: bash ./gradlew assembleDebug

      # v0.1 must not request INTERNET (see CLAUDE.md); fail the build if a dependency added it.
      - name: Check the APK has no INTERNET permission
        run: |
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          "$AAPT2" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee permissions.txt
          if grep -q 'android.permission.INTERNET' permissions.txt; then
            echo "::error::The APK requests android.permission.INTERNET"
            exit 1
          fi

      - name: Publish to a private pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT="${GITHUB_SHA::7}"
          APK="guardian-ai-debug-${SHORT}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          gh release create "build-${{ github.run_number }}" "$APK" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Guardian AI debug build #${{ github.run_number }}" \
            --notes "Debug APK built from ${SHORT} on ${{ github.ref_name }}. Open this page on the phone, download the APK and install it."
